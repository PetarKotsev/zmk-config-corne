CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Uncomment the following lines to enable the Corne RGB Underglow
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO=y

CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=25

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_NICE_VIEW_GEM_ANIMATION=y

# Sleep / power saving
# Go idle after 30 s without typing (ZMK default)
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Turn RGB underglow off while idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# Deep sleep after 15 min without typing; any key press wakes it
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
